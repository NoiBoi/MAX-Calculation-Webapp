[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxcalc-scientific-service"
version = "0.1.0"
description = "Isolated crystallographic computation service for MAXCalc"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "lmfit==1.3.4",
  "pymatgen==2026.9.24",
  "pybaselines==1.2.1",
  "python-multipart==0.0.20",
  "scipy==1.18.1",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["maxcalc_science*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
